<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Darimana Duitnya - Pencatat Keuangan Pribadi</title>
    
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Add to Home Screen Web App Capability -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Darimana Duitnya" />
    <meta name="theme-color" content="#020617" />
    
    <!-- Open Graph Link Preview Metadata (WhatsApp, Telegram, etc.) -->
    <meta property="og:title" content="Darimana Duitnya - Pencatat Keuangan" />
    <meta property="og:description" content="Aplikasi pencatat keuangan praktis, aman, dan tanpa iklan. Support sinkronisasi otomatis Google Sheets!" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Darimana Duitnya" />
    
    <!-- Twitter Card previews -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Darimana Duitnya - Pencatat Keuangan" />
    <meta name="twitter:description" content="Aplikasi pencatat keuangan praktis dan aman dengan sinkronisasi otomatis Google Sheets." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('PWA Service Worker registered successfully on scope:', reg.scope);
            })
            .catch((err) => {
              console.error('PWA Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
